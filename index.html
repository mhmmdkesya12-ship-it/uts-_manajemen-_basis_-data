<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS Manajemen Basis Data - Riwayat Pendidikan</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Daftar Riwayat Pendidikan</h4>
                        <small>Politeknik Manahijul Huda - TRPL</small>
                    </div>
                    <div class="card-body">
                        
                        <!-- Form Input Data -->
                        <form id="formRiwayat" class="mb-4">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Nama Sekolah</label>
                                    <input type="text" class="form-control" id="nama_sekolah" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Tahun Masuk</label>
                                    <input type="number" class="form-control" id="tahun_masuk" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Tahun Lulus</label>
                                    <input type="number" class="form-control" id="tahun_lulus" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Keterangan</label>
                                    <input type="text" class="form-control" id="keterangan" placeholder="Cth: Lulus" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success mt-3">Simpan Data</button>
                        </form>

                        <hr>

                        <!-- Tabel Data Riwayat -->
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped">
                                <thead class="table-dark">
                                    <tr>
                                        <th>No</th>
                                        <th>Nama Sekolah</th>
                                        <th>Tahun Masuk</th>
                                        <th>Tahun Lulus</th>
                                        <th>Keterangan</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelRiwayat">
                                    <!-- Data akan dimuat via JavaScript -->
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script sql.js dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="script.js"></script>
</body>
</html>
